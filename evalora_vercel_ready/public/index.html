<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evalora AI</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><small>AI-ASSISTED PROJECT ASSESSMENT</small><h1>Evalora AI</h1><p>Three-stage Gemini evaluation with automatic fallback and Google Sheets saving.</p></header>
<form id="form"><div class="grid">
<label>Evaluator name<input name="name" required></label><label>Project ID<input name="project_id" required></label>
<label class="wide">Project name<input name="project_name" required></label>
<label>Phase<select name="phase"><option>Ideation</option><option>Design</option><option>Build</option><option>Demo</option></select></label>
<label>Guideline file (optional)<input type="file" name="guideline_file" accept=".pdf,.docx,.pptx,.txt,.md,.csv"></label>
<label class="wide">Guidelines / rubric<textarea name="guideline_text" rows="4" placeholder="Paste evaluation guidelines here"></textarea></label>
<label class="wide">Project submission (max 8 MB)<input type="file" name="submission_file" required accept=".pdf,.docx,.pptx,.txt,.md,.csv"></label></div>
<button id="submit">Evaluate project</button><p id="status" role="status" aria-live="polite"></p></form>
<section id="result" hidden><h2 id="score"></h2><h3>Evaluation report</h3><pre id="report"></pre><p id="sheet"></p><p id="models"></p></section></main><script src="/script.js"></script></body></html>
